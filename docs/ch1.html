<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市科技 Python（高一第二學期） — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.5;white-space:pre-wrap}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>

-height:1.6;'>商品搜尋、自己的工具函式<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>🤖 資料與 AI<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>12<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>9<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Pandas、機器學習入門<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>開放資料分析、第一個 AI 模型<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>🎯 期末專題<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>13–15<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>10<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>API、Gradio 互動網頁<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>與人互動的資料小工具<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🎯 3 學期制的第 2 學期，共 15 週、每週 2 節。期末要做出一個<strong>能和人互動、用真實資料<\/strong>的小工具，例如「輸入測站，回報空氣品質」。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "什麼是程式設計", "chapter": "第一節：程式與程式語言", "bg": "white", "html": "<h2 class='slide-title'>💡 程式設計 Programming 是什麼？<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>程式（Program）是一組<strong>讓電腦一步一步執行的指令<\/strong>。程式設計就是把「解決問題的方法」寫成電腦看得懂的指令。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔍<\/div><strong style='color:#1e40af;font-size:.9rem;'>① 分析問題<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>輸入是什麼？要輸出什麼？<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🧭<\/div><strong style='color:#166534;font-size:.9rem;'>② 設計演算法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>用步驟、流程圖把方法想清楚<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🛠️<\/div><strong style='color:#854d0e;font-size:.9rem;'>③ 寫程式＆測試<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>用程式語言實作，再除錯<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🍳 比喻：演算法是<strong>食譜<\/strong>，程式是用某種語言（中文、英文…）寫下的食譜，電腦是照著做的<strong>廚師<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "程式語言的演進", "chapter": "第一節：程式與程式語言", "bg": "white", "html": "<h2 class='slide-title'>🕰️ 程式語言的演進<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:20%;'>世代<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>例子<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>特色<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>機器語言<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>10110000 01100001<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>只有 0 與 1，電腦直接執行，人很難讀<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>組合語言<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>MOV AL, 61h<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>用英文縮寫代替 0/1，仍和硬體綁在一起<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>高階語言<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>C、Java、<strong>Python<\/strong><\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>接近人類語言，需要編譯器或直譯器翻譯<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>AI 協作時代<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>自然語言提示＋程式<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>AI 幫忙寫、解釋程式，但人仍要<strong>看得懂、驗得了<\/strong><\/td><\/tr><\/table>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🧠 AI 會寫程式，不代表不用學：看不懂程式的人，就沒辦法判斷 AI 給的答案對不對。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "為什麼學 Python", "chapter": "第一節：程式與程式語言", "bg": "white", "html": "<h2 class='slide-title'>🐍 為什麼選 Python？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>✨<\/div><strong style='color:#166534;font-size:.9rem;'>語法簡潔<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>用縮排表示區塊，讀起來接近英文。<br><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(&quot;Hello&quot;)<\/code> 一行就能輸出<\/div><\/div><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📦<\/div><strong style='color:#1e40af;font-size:.9rem;'>套件豐富<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>資料分析（Pandas）、AI（scikit-learn、PyTorch）、網頁、物聯網都能用<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🌏<\/div><strong style='color:#5b21b6;font-size:.9rem;'>應用廣泛<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>資料科學、機器學習、自動化、教學；也是 APCS 可選用的語言之一<\/div><\/div><div style='background:#fff7ed;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>☁️<\/div><strong style='color:#9a3412;font-size:.9rem;'>免安裝就能寫<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>用瀏覽器開 Google Colab 就能寫，程式在雲端執行<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🇹🇼 在地應用：政府開放資料平臺上的 YouBike、空氣品質、公車動態，都能用 Python 抓下來分析——第 9、10 章就會做。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 6, "title": "第一節 隨堂測驗", "chapter": "第一節：程式與程式語言", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>程式與程式語言 ｜ 4 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 7, "title": "認識 Google Colab", "chapter": "第二節：Colab 開發環境", "bg": "white", "html": "<h2 class='slide-title'>📓 Google Colab：雲端的 Python 筆記本<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>Colab（Colaboratory）是 Google 提供的免費線上 Jupyter 筆記本，<strong>不用安裝<\/strong>，用學校 Google 帳號登入就能寫 Python。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>☁️<\/div><strong style='color:#1e40af;font-size:.9rem;'>雲端執行<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>程式在 Google 的主機上跑，學校電腦、家裡電腦、平板都能用<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>💾<\/div><strong style='color:#166534;font-size:.9rem;'>自動存雲端硬碟<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>筆記本存在你的 Google 雲端硬碟「Colab Notebooks」資料夾<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔗<\/div><strong style='color:#854d0e;font-size:.9rem;'>可分享<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>像 Google 文件一樣，用連結分享給老師或組員<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> ⏱️ 一段時間沒操作，Colab 會中斷連線，變數會清空；重新連線後要從上面的儲存格<strong>再執行一次<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 8, "title": "兩種儲存格", "chapter": "第二節：Colab 開發環境", "bg": "white", "html": "<h2 class='slide-title'>🧱 兩種儲存格：程式碼與文字<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><strong style='color:#1e40af;font-size:.9rem;'>💻 程式碼儲存格<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>寫 Python 程式<br>▶ 按左邊播放鍵，或 <strong>Shift + Enter<\/strong> 執行<br>結果會顯示在下方<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><strong style='color:#166534;font-size:.9rem;'>📝 文字儲存格<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>寫說明、筆記、題目<br>支援 Markdown：<code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'># 標題<\/code>、<code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>**粗體**<\/code><br>也能寫數學式：<code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>$x^2$<\/code><\/div><\/div><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:35%;'>快捷鍵<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:65%;'>功能<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Shift + Enter<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>執行目前儲存格並跳到下一格<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Ctrl + Enter<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>執行但停在原儲存格<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Ctrl + /<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>把選取的程式行加上／取消 # 註解<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Ctrl + M  B<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>在下方新增程式碼儲存格<\/td><\/tr><\/table>\n", "quiz": null, "chart": null, "video": null}, {"id": 9, "title": "建議設定", "chapter": "第二節：Colab 開發環境", "bg": "white", "html": "<h2 class='slide-title'>⚙️ 上課前先做的兩個設定<\/h2>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>關掉自動完成<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>工具 → 設定 → 編輯器 → <strong>取消<\/strong>勾選「自動觸發程式碼完成功能」。初學時自己打字，語法才記得住。<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>儲存副本<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>開啟老師的練習檔後，先按 <strong>檔案 → 在雲端硬碟中儲存副本<\/strong>，再在副本上作答。否則關掉頁面就不見了。<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>改檔名<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>副本檔名改成「座號_姓名_py01」，繳交時老師才找得到。<\/div><\/div><\/div><\/div>\n<div style='background:#fef2f2;padding:11px 16px;border-radius:8px;border-left:4px solid #dc2626;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🤖 Colab 內建 AI 助手（Gemini）。這學期的練習請<strong>先自己寫<\/strong>，卡住超過 10 分鐘再問 AI，而且要能解釋 AI 給的每一行。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 10, "title": "打開第 1 課練習", "chapter": "第二節：Colab 開發環境", "bg": "white", "html": "<h2 class='slide-title'>📓 打開第 1 課 Colab 練習<\/h2>\n<div style='display:flex;align-items:center;gap:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 16px;margin-bottom:12px;'><div style='font-size:2rem;'>📓<\/div><div style='flex:1;'><strong style='color:#9a3412;font-size:.9rem;'>第 1 課：認識 Colab 與輸出入<\/strong><div style='font-size:.78rem;color:#475569;margin-top:4px;line-height:1.6;'>包含 print()、input()、註解的示範，以及 3 題實作。記得先「在雲端硬碟中儲存副本」！<br>🔐 請用學校 Google 帳號登入才能開啟。<\/div><\/div><a href='https://colab.research.google.com/drive/1IorXVliFq_vndE-vFzfXHdfpaCBaBkpM' target='_blank' rel='noopener' style='background:#f9ab00;color:#1f2937;font-weight:700;font-size:.82rem;padding:9px 16px;border-radius:20px;text-decoration:none;white-space:nowrap;'>在 Colab 開啟 ↗<\/a><\/div>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>🧪 示範儲存格<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>已經寫好程式，按 ▶ 執行，觀察結果，再試著改改看<\/div><\/div><div style='background:#fff7ed;padding:14px;border-radius:10px;'><strong style='color:#9a3412;font-size:.9rem;'>✏️ 練習儲存格<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>開頭寫著「# ✏️ 練習」，只有提示，要自己完成<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 💬 遇到紅字錯誤訊息不要怕！先看<strong>最後一行<\/strong>：它會告訴你錯誤種類（如 SyntaxError、NameError）和出錯的行號。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 11, "title": "第二節 隨堂測驗", "chapter": "第二節：Colab 開發環境", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>Colab 開發環境 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 12, "title": "print() 基本用法", "chapter": "第三節：print 與 input", "bg": "white", "html": "<h2 class='slide-title'>🖨️ print()：讓電腦說話<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>語法：<code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(資料1, 資料2, ..., sep=&#x27; &#x27;, end=&#x27;\\n&#x27;)<\/code>　多個資料用逗號隔開；預設以<strong>空格<\/strong>分隔、輸出完<strong>換行<\/strong>。<\/p><\/div>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>字串要加引號，數字和運算式不用<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>print(&quot;Hello&quot;, &quot;Python&quot;)\nprint(1 + 2)\nprint(&quot;1+2=&quot;, 1 + 2)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>Hello Python\n3\n1+2= 3<\/pre><\/div><\/div>\n<div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💡<\/div><strong style='color:#1e40af;font-size:.9rem;'>引號很重要<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(&quot;1+2&quot;)<\/code> 輸出 <strong>1+2<\/strong>（字串原樣輸出）<br><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(1+2)<\/code> 輸出 <strong>3<\/strong>（先計算）<br><br>單引號 ' 或雙引號 \" 都可以，但前後要一致。<\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 13, "title": "字串串接與重複", "chapter": "第三節：print 與 input", "bg": "white", "html": "<h2 class='slide-title'>➕ 字串可以「加」也可以「乘」<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>print(&quot;Hello&quot; + &quot;Python!&quot;)\nprint(&quot;Go! &quot; * 3)\nprint(&quot;2026&quot;, &quot;11&quot;, &quot;04&quot;, sep=&quot;/&quot;)\nprint(&quot;不換行&quot;, end=&quot;&quot;)\nprint(&quot;…接在後面&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>HelloPython!\nGo! Go! Go! \n2026/11/04\n不換行…接在後面<\/pre><\/div><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>寫法<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:70%;'>效果<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>+<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>把兩個字串接起來（中間沒空格）<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>*<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>把字串重複 n 次<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>sep=\"/\"<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>資料之間改用 / 分隔<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>end=\"\"<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>輸出完不換行<\/td><\/tr><\/table>\n<\/div>\n<div style='background:#fef2f2;padding:11px 16px;border-radius:8px;border-left:4px solid #dc2626;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> ⚠️ <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>&quot;年齡&quot; + 16<\/code> 會出錯（TypeError）：字串不能直接和數字相加。用逗號 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(&quot;年齡&quot;, 16)<\/code> 就沒問題。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 14, "title": "input() 取得輸入", "chapter": "第三節：print 與 input", "bg": "white", "html": "<h2 class='slide-title'>⌨️ input()：讓使用者輸入<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>語法：<code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>變數 = input(&quot;提示字串&quot;)<\/code>　程式會停下來等使用者輸入，按 Enter 後把輸入的內容存進變數。<\/p><\/div>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>執行後在下方框框輸入名字，按 Enter<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>name = input(&quot;請輸入您的名字：&quot;)\nprint(&quot;你好，&quot;, name)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>請輸入您的名字：小安\n你好， 小安<\/pre><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🔑 <strong>input() 拿到的一定是字串<\/strong>。輸入 16，得到的是 \"16\"。要計算的話，下週會學用 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>int()<\/code>、<code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>float()<\/code> 轉成數字。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "註解與 f-string", "chapter": "第三節：print 與 input", "bg": "white", "html": "<h2 class='slide-title'>📝 註解 # 與 f-string<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1.2fr;gap:12px;'><div style='background:#f8fafc;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💬<\/div><strong style='color:#334155;font-size:.9rem;'># 註解<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>從 # 到行尾都不會被執行，用來<strong>說明程式<\/strong>。<br>好的註解寫「為什麼這樣做」，不是重複程式在做什麼。<br>多行一起加註解：選取後按 Ctrl + /<\/div><\/div><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>f-string（Python 3.6 起）<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>city = &quot;台北&quot;\nyear = 2026\n# f-string：字串前加 f，變數放在 { } 裡\nprint(f&quot;{year} 年我在{city}&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>2026 年我在台北<\/pre><\/div><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 ✨ f-string 是現在最常見的輸出寫法，之後還可以控制小數位數，例如 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>f&quot;{3.14159:.2f}&quot;<\/code> → 3.14<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 16, "title": "常見錯誤", "chapter": "第三節：print 與 input", "bg": "white", "html": "<h2 class='slide-title'>🐞 新手最常見的 4 種錯誤<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>錯誤寫法<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:22%;'>錯誤訊息<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:48%;'>原因<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>Print(&quot;Hi&quot;)<\/code><\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>NameError<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Python 大小寫有別，要寫 print<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(&quot;Hi)<\/code><\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>SyntaxError<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>引號沒有成對<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print（&quot;Hi&quot;）<\/code><\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>SyntaxError<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>用了<strong>全形<\/strong>括號，要切換成半形<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(name)<\/code><\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>NameError<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>name 還沒有被指定值（或上面的儲存格沒執行）<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔍 除錯口訣：<strong>看最後一行 → 找行號 → 檢查拼字、引號、括號、全形半形<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "第三節 隨堂測驗", "chapter": "第三節：print 與 input", "bg": "purple", "quiz": "q3", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>print 與 input ｜ 5 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 18, "title": "認識 Online Judge", "chapter": "第四節：線上練習網站（Online Judge）", "bg": "white", "html": "<h2 class='slide-title'>💻 Online Judge：讓系統幫你改程式<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>Online Judge（線上評測系統）會用<strong>好幾組測試資料<\/strong>執行你的程式，比對輸出是否和標準答案<strong>完全一樣<\/strong>，自動給分。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🏫<\/div><strong style='color:#166534;font-size:.9rem;'>本課程練習網站<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>Moodle VPL<br>115芳和高中資訊科技Py<br>用學校帳號登入<\/div><\/div><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>⚖️<\/div><strong style='color:#1e40af;font-size:.9rem;'>ZeroJudge<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>高中生線上解題系統<br>zerojudge.tw<br>題庫最多、有排名<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🎓<\/div><strong style='color:#5b21b6;font-size:.9rem;'>APCS<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>大學程式設計先修檢測<br>觀念題＋實作題<br>可作為申請入學參考<\/div><\/div><\/div>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#166534;font-size:.88rem;'>登入練習網站，點進題目<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>先讀「描述」：輸入格式、輸出格式、範例<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#166534;font-size:.88rem;'>先在 Colab 寫好、用範例測過<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>輸出和範例一字不差再貼上<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#166534;font-size:.88rem;'>在「編輯」貼上程式 → 按「評估」<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>系統會跑好幾組測資，馬上給分<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>4<\/div><div><strong style='color:#166534;font-size:.88rem;'>沒滿分？看提示修改後再評估<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>評估可以重複，最後一次的分數為準<\/div><\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 19, "title": "輸出格式要一模一樣", "chapter": "第四節：線上練習網站（Online Judge）", "bg": "white", "html": "<h2 class='slide-title'>🎯 輸出要「一字不差」<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>題目要求<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:40%;'>你的輸出<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>結果<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>15<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>答案是 15<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>❌ 多了文字<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>15<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>請輸入數字：15<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>❌ input() 的提示字也會被印出來<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>大吉<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>大 吉<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>❌ 多了空白<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3.5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3.50<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>❌ 小數位數不對<\/td><\/tr><\/table>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📓<\/div><strong style='color:#991b1b;font-size:.9rem;'>在 Colab 練習時<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>input(&quot;請輸入名字：&quot;)<\/code><br>有提示字，方便自己操作 👍<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💻<\/div><strong style='color:#166534;font-size:.9rem;'>在練習網站時<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>input()<\/code> 括號內<strong>不要寫提示字<\/strong>，<br><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print()<\/code> 只印題目要求的內容。<\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 20, "title": "評測結果看不懂", "chapter": "第四節：線上練習網站（Online Judge）", "bg": "white", "html": "<h2 class='slide-title'>🧯 評測結果看不懂？<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>狀況<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:26%;'>意思<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:44%;'>常見原因<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>輸出不符（Wrong Answer）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>程式能跑，答案錯<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>邏輯錯、格式多空白、多了提示字<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>執行錯誤（Runtime Error）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>執行到一半當掉<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>輸入讀錯（ValueError）、除以 0<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>逾時（Time Limit）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>跑太久<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>無窮迴圈、演算法太慢<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>語法錯誤（Syntax Error）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>程式本身寫錯<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>少冒號、縮排錯、全形符號<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px; :7px 14px;border-radius:18px;text-decoration:none;white-space:nowrap;'>前往練習網站 ↗<\/a><\/div><ul style='margin:8px 0 0 18px;font-size:.8rem;color:#334155;line-height:1.6;'><li style='margin-bottom:3px;'><strong>#301<\/strong> 輸出指令（測驗）<\/li><li style='margin-bottom:3px;'><strong>#302<\/strong> 讓電腦說哈囉（VPL）<\/li><li style='margin-bottom:3px;'><strong>#303<\/strong> 輸入指令（測驗）<\/li><li style='margin-bottom:3px;'><strong>#304<\/strong> 讓電腦對您說 Hello（VPL）<\/li><\/ul><div style='font-size:.72rem;color:#64748b;margin-top:6px;'>課程：115芳和高中資訊科技Py ｜ VPL 題送出後系統會自動「評估」給分<\/div><\/div>\n<div style='background:#fffbeb;border-radius:10px;padding:14px;'><strong style='color:#92400e;font-size:.9rem;'>📏 評分規準<\/strong><p style='font-size:.78rem;color:#334155;margin-top:6px;line-height:1.8;'><strong style='color:#059669;'>A<\/strong> 3 題都正確，輸出格式整齊，並加上自己的註解<br><strong style='color:#2563eb;'>B<\/strong> 3 題都能執行，結果正確<br><strong style='color:#d97706;'>C<\/strong> 完成 2 題，或有小錯誤<br><strong style='color:#dc2626;'>D<\/strong> 完成 1 題以下<\/p><\/div>", "quiz": null, "chart": null, "video": null}, {"id": 23, "title": "本週總結", "chapter": "實作與總結", "bg": "navy", "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 本週重點<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>程式設計<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>分析問題 → 設計演算法 → 寫程式與測試<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>Colab<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>雲端 Python 筆記本；先「儲存副本」再作答<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>print()<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>逗號隔開多個資料；sep 改分隔、end 改結尾<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>input()<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>取得的一定是字串，要計算需轉型<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>Online Judge<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>輸出要一字不差；練習網站的 input() 不寫提示字<\/p><\/div><\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>「程式不是寫給電腦看的，是寫給人看、順便讓電腦執行的。」<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下一章：變數、資料型態與運算子——讓程式真的會「算」<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "下列哪一個是「程式設計」的正確步驟順序？", "options": ["寫程式 → 分析問題 → 設計演算法", "分析問題 → 設計演算法 → 寫程式並測試", "設計演算法 → 測試 → 分析問題", "直接寫程式，錯了再說"], "answer": 1, "explain": "先弄清楚輸入和輸出（分析問題），再想清楚步驟（演算法），最後才用程式語言實作並測試。跳過前兩步，常常寫到一半才發現方向錯了。"}, {"q": "電腦可以「直接」執行的是哪一種語言？", "options": ["Python", "組合語言", "機器語言", "中文"], "answer": 2, "explain": "CPU 只認得 0 與 1 組成的機器語言。Python 等高階語言要經過直譯器或編譯器翻譯成機器語言才能執行。"}, {"q": "下列關於 Python 的敘述，何者「錯誤」？", "options": ["用縮排表示程式區塊", "有很多資料分析與 AI 套件", "只能在安裝了 Python 的電腦上寫，瀏覽器不行", "語法接近英文，適合初學"], "answer": 2, "explain": "用 Google Colab，只要有瀏覽器和 Google 帳號就能寫 Python，程式在雲端主機上執行。"}, {"q": "現在 AI 也會寫程式，為什麼還要學程式設計？最好的理由是？", "options": ["AI 寫的程式一定是錯的", "要能看懂並驗證 AI 給的程式是否正確", "因為考試要考", "學程式就不用學數學"], "answer": 1, "explain": "AI 給的程式可能對、也可能有錯或不符合需求。看得懂程式，才能判斷、修改並負責自己交出去的成果。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "在 Colab 中，執行目前的程式碼儲存格並跳到下一格，快捷鍵是？", "options": ["Ctrl + S", "Shift + Enter", "Alt + F4", "Ctrl + Z"], "answer": 1, "explain": "Shift + Enter 會執行目前儲存格並移到下一格；Ctrl + Enter 則是執行後停在原處。"}, {"q": "打開老師分享的 Colab 練習檔後，第一件事應該做什麼？", "options": ["直接在老師的檔案上作答", "檔案 → 在雲端硬碟中儲存副本", "把所有儲存格刪掉", "關掉重開"], "answer": 1, "explain": "老師分享的檔案你沒有編輯權，直接寫不會被儲存。先儲存副本到自己的雲端硬碟，作答才會保留下來。"}, {"q": "Colab 閒置一段時間後重新連線，執行 print(name) 出現 NameError，最可能的原因是？", "options": ["print 拼錯", "重新連線後變數被清空，要重新執行上面指定 name 的儲存格", "Colab 壞了", "網路太慢"], "answer": 1, "explain": "中斷連線後執行環境會重置，之前存在記憶體裡的變數都不見了。從上往下重新執行一次就好。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "print(\"1+2=\", 1+2) 的輸出是？", "options": ["1+2= 1+2", "1+2= 3", "3= 3", "1+2=3"], "answer": 1, "explain": "引號內的 \"1+2=\" 原樣輸出；沒有引號的 1+2 會先計算成 3。兩個資料之間預設用一個空格隔開。"}, {"q": "print(\"A\", \"B\", \"C\", sep=\"-\") 的輸出是？", "options": ["A B C", "A-B-C", "ABC", "-A-B-C-"], "answer": 1, "explain": "sep 指定資料之間的分隔符號，預設是空格，這裡改成 \"-\"，所以輸出 A-B-C。"}, {"q": "print(\"Hi\" * 3) 的輸出是？", "options": ["Hi3", "HiHiHi", "Hi Hi Hi", "錯誤"], "answer": 1, "explain": "字串乘以整數 n 代表重複 n 次，中間不會自動加空格。"}, {"q": "x = input(\"輸入：\")，使用者輸入 16，x 的資料型態是？", "options": ["整數 int", "浮點數 float", "字串 str", "布林 bool"], "answer": 2, "explain": "input() 回傳的一定是字串。要當成數字計算，必須用 int(x) 或 float(x) 轉換。"}, {"q": "執行 print（\"Hello\"） 出現 SyntaxError，最可能的原因是？", "options": ["Hello 拼錯", "括號是全形的", "沒有寫分號", "要先 import print"], "answer": 1, "explain": "Python 的符號都要用半形。全形括號（）、全形引號「」或＂是新手最常見的錯誤之一。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "在線上練習網站寫題目時，下列哪個寫法最可能被判錯？", "options": ["name = input()", "name = input(\"請輸入名字：\")", "print(\"Hello\", name)", "print(name)"], "answer": 1, "explain": "input() 括號裡的提示字會被印到輸出，和標準答案不一樣就會被判錯。練習網站只印題目要求的內容。"}, {"q": "程式在 Colab 能執行，送到 Online Judge 卻顯示「輸出不符」，最先該檢查什麼？", "options": ["電腦是否太舊", "輸出格式是否和題目範例一字不差", "網路速度", "程式是否太短"], "answer": 1, "explain": "Wrong Answer 代表程式能跑，但輸出和標準答案不同。最常見的是多了提示字、多空白、小數位數不同。"}, {"q": "Online Judge 怎麼知道你的程式對不對？", "options": ["老師一題一題看", "用好幾組測試資料執行，比對輸出和標準答案是否完全相同", "看程式寫得長不長", "看有沒有寫註解"], "answer": 1, "explain": "系統會用多組測資（包含題目沒給的特殊情況）執行你的程式，全部輸出都正確才是滿分。"}]}};</script>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 23;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u7a0b\u5f0f\u8207\u7a0b\u5f0f\u8a9e\u8a00", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1aColab \u958b\u767c\u74b0\u5883", "start": 7}, {"name": "\u7b2c\u4e09\u7bc0\uff1aprint \u8207 input", "start": 12}, {"name": "\u7b2c\u56db\u7bc0\uff1a\u7dda\u4e0a\u7df4\u7fd2\u7db2\u7ad9\uff08Online Judge\uff09", "start": 18}, {"name": "\u5be6\u4f5c\u8207\u7e3d\u7d50", "start": 22}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
