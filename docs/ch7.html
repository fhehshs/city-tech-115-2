<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市科技 Python（高一第二學期） — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.5;white-space:pre-wrap}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>

<script>window.__SLIDES__=[{"id": 1, "title": "排序與搜尋", "chapter": "封面", "bg": "navy", "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>🔎<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>排序與搜尋<\/h1>\n  <h2 style='font-size:1.25rem;font-weight:400;color:#93c5fd;margin-bottom:24px;'>Bubble Sort · Sequential Search · Binary Search<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;'><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🫧 氣泡排序<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🚶 循序搜尋<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>✂️ 二分搜尋<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>⏱️ 效率比較<\/span><\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>城市科技 · 高一第二學期 ｜ 第 9–10 週<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 2, "title": "生活中的排序", "chapter": "第一節：氣泡排序", "bg": "white", "html": "<h2 class='slide-title'>📶 排序無所不在<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🏅<\/div><strong style='color:#1e40af;font-size:.9rem;'>成績排名<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>由高到低<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🛍️<\/div><strong style='color:#166534;font-size:.9rem;'>購物網站<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>依價格、評價排序<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📇<\/div><strong style='color:#854d0e;font-size:.9rem;'>通訊錄<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>依姓名筆畫或注音<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔍<\/div><strong style='color:#5b21b6;font-size:.9rem;'>搜尋結果<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>依相關程度排序<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 資料排好序之後，「找東西」會快非常多——這就是本週後半要學的二分搜尋。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "氣泡排序原理", "chapter": "第一節：氣泡排序", "bg": "white", "html": "<h2 class='slide-title'>🫧 氣泡排序（Bubble Sort）原理<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>反覆走訪串列，<strong>兩兩比較相鄰的資料，前面比後面大就交換<\/strong>。每走完一輪，最大的數就像氣泡一樣「浮」到最後面。<\/p><\/div>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#115e59;font-size:.88rem;'>比較 a[0] 和 a[1]<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>前面大就交換<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#115e59;font-size:.88rem;'>比較 a[1] 和 a[2]<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>前面大就交換<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#115e59;font-size:.88rem;'>…一路比到最後<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>第 1 輪結束，最大的數到最後一格<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>4<\/div><div><strong style='color:#115e59;font-size:.88rem;'>重複下一輪<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>已經排好的最後面不用再比<\/div><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 📜 氣泡排序是很早被提出的基本排序法，簡單易懂，但資料多時效率不好，常用來入門。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "第 1 輪過程", "chapter": "第一節：氣泡排序", "bg": "white", "html": "<h2 class='slide-title'>🔬 a = [4, 3, 5, 1, 2] 第 1 輪<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:24%;'>比較<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>結果<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:46%;'>串列<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4 vs 3<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4 > 3，交換<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[<strong>3, 4<\/strong>, 5, 1, 2]<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4 vs 5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>不交換<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[3, <strong>4, 5<\/strong>, 1, 2]<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5 vs 1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5 > 1，交換<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[3, 4, <strong>1, 5<\/strong>, 2]<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5 vs 2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5 > 2，交換<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[3, 4, 1, <strong>2, 5<\/strong>]<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🫧 第 1 輪結束：最大的 <strong>5<\/strong> 已經到了最後面，第 2 輪只要比前 4 個。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "每一輪結果", "chapter": "第一節：氣泡排序", "bg": "white", "html": "<h2 class='slide-title'>🔁 每一輪的結果<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:20%;'>輪次<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:22%;'>比較次數<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:58%;'>這輪結束後<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>開始<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>—<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[4, 3, 5, 1, 2]<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第 1 輪<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[3, 4, 1, 2, <strong>5<\/strong>]<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第 2 輪<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[3, 1, 2, <strong>4, 5<\/strong>]<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第 3 輪<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[1, 2, <strong>3, 4, 5<\/strong>]<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第 4 輪<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>[<strong>1, 2, 3, 4, 5<\/strong>]<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧮 n 筆資料：最多 n−1 輪；第 i 輪比較 n−i 次。總比較次數 = (n−1) + (n−2) + … + 1 = <strong>n(n−1)/2<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 6, "title": "氣泡排序程式", "chapter": "第一節：氣泡排序", "bg": "white", "html": "<h2 class='slide-title'>💻 氣泡排序程式<\/h2>\n<div style='display:grid;grid-template-columns:1.5fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>a = [4, 3, 5, 1, 2]\nn = len(a)\nfor i in range(1, n):          # 第 i 輪\n    for j in range(n - i):     # 比較 n-i 次\n        if a[j] &gt; a[j + 1]:\n            a[j], a[j + 1] = a[j + 1], a[j]\n    print(f&quot;第{i}輪：&quot;, a)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>第1輪： [3, 4, 1, 2, 5]\n第2輪： [3, 1, 2, 4, 5]\n第3輪： [1, 2, 3, 4, 5]\n第4輪： [1, 2, 3, 4, 5]<\/pre><\/div><\/div>\n<div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧩<\/div><strong style='color:#1e40af;font-size:.9rem;'>用到前幾週的<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>✔ 雙重迴圈（第 4 章）<br>✔ 兩數交換（第 3 章）<br>✔ 串列索引（第 6 章）<br><br>想改成<strong>由大到小<\/strong>？只要把 &gt; 改成 &lt;。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#502 排序商品編號<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 7, "title": "提早結束", "chapter": "第一節：氣泡排序", "bg": "white", "html": "<h2 class='slide-title'>⚡ 優化：已經排好就提早結束<\/h2>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>for i in range(1, n):\n    swapped = False\n    for j in range(n - i):\n        if a[j] &gt; a[j + 1]:\n            a[j], a[j + 1] = a[j + 1], a[j]\n            swapped = True\n    if not swapped:      # 這一輪完全沒交換 → 已經排好\n        break<\/pre><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 💡 上一頁第 3 輪就排好了，第 4 輪是白做的。加一個「有沒有交換」的旗標（flag），可以省下多餘的比較。實際上 Python 的 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>sorted()<\/code> 用的是更快的演算法（Timsort）。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 8, "title": "第一節 隨堂測驗", "chapter": "第一節：氣泡排序", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>氣泡排序 ｜ 4 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 9, "title": "循序搜尋原理", "chapter": "第二節：循序搜尋", "bg": "white", "html": "<h2 class='slide-title'>🚶 循序搜尋（Sequential Search）<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>從第一個開始，<strong>一個一個比對<\/strong>是否等於要找的鍵值（key），找到就停。<\/p><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:14%;'>步驟<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:46%;'>比較<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:40%;'>結果<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>a[0] = 4 是 1 嗎？<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>不是，繼續<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>a[1] = 6 是 1 嗎？<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>不是，繼續<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>a[2] = 3 是 1 嗎？<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>不是，繼續<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>a[3] = 8 是 1 嗎？<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>不是，繼續<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>a[4] = 1 是 1 嗎？<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><strong>找到了！索引 4<\/strong><\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 📌 a = [4, 6, 3, 8, 1, 2, 7, 5]，搜尋 key = 1。優點：資料<strong>不用先排序<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 10, "title": "循序搜尋程式", "chapter": "第二節：循序搜尋", "bg": "white", "html": "<h2 class='slide-title'>💻 循序搜尋程式<\/h2>\n<div style='display:grid;grid-template-columns:1.4fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>a = [3, 8, 2, 9, 1, 6, 5, 4, 7]\nkey = int(input(&quot;搜尋：&quot;))\ni = 0\nwhile i &lt; len(a):\n    if a[i] == key:\n        print(&quot;在索引&quot;, i)\n        break\n    i += 1\nif i == len(a):\n    print(&quot;沒搜尋到資料&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>搜尋：5\n在索引 6<\/pre><\/div><\/div>\n<div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🤔<\/div><strong style='color:#854d0e;font-size:.9rem;'>怎麼知道沒找到？<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>如果走完整個串列都沒有 break，<br>i 會一路加到 len(a)。<br><br>所以最後檢查 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>i == len(a)<\/code> 就知道是「找完了還沒找到」。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#504 循序搜尋商品編號<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 11, "title": "循序搜尋效率", "chapter": "第二節：循序搜尋", "bg": "white", "html": "<h2 class='slide-title'>⏱️ 循序搜尋要比幾次？<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>情況<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>比較次數（n 筆資料）<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>最好：第一個就是<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1 次<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>最差：最後一個或找不到<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>n 次<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>平均<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>約 n/2 次<\/td><\/tr><\/table>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>👍<\/div><strong style='color:#166534;font-size:.9rem;'>適合<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>資料量小、資料沒排序、只找一兩次<\/div><\/div><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>👎<\/div><strong style='color:#991b1b;font-size:.9rem;'>不適合<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>資料量很大（例如全臺 2300 多萬人的資料）、要反覆搜尋<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🤔 有沒有更快的方法？如果資料<strong>已經排好序<\/strong>，就可以用二分搜尋！<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 12, "title": "第二節 隨堂測驗", "chapter": "第二節：循序搜尋", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>循序搜尋 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 13, "title": "猜數字遊戲", "chapter": "第三節：二分搜尋與效率", "bg": "white", "html": "<h2 class='slide-title'>🎮 猜數字：1～100，最少幾次一定猜得到？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1.4fr;gap:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🎲<\/div><strong style='color:#991b1b;font-size:.9rem;'>亂猜<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>可能要猜很多次，運氣好壞差很多<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>✂️<\/div><strong style='color:#166534;font-size:.9rem;'>每次猜中間<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>猜 50 → 「太大」→ 只剩 1～49<br>猜 25 → 「太小」→ 只剩 26～49<br>…每次<strong>砍掉一半<\/strong><br><br>最多 <strong>7 次<\/strong>一定猜到（2⁷ = 128 ≥ 100）<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 💡 這個「每次猜中間、砍一半」的策略，就是<strong>二分搜尋<\/strong>。前提是資料要<strong>有順序<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 14, "title": "二分搜尋過程", "chapter": "第三節：二分搜尋與效率", "bg": "white", "html": "<h2 class='slide-title'>✂️ 二分搜尋：找商品編號 131<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>a = [101, 103, 107, 112, 118, 125, 131, 140, 152, 160]（已排序），mid = (left + right) // 2<\/p><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:10%;'>次數<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:10%;'>left<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:10%;'>right<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:10%;'>mid<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:12%;'>a[mid]<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:48%;'>判斷<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>0<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>9<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>118<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>118 &lt; 131 → 往右，left = 5<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>9<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>7<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>140<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>140 > 131 → 往左，right = 6<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>6<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>125<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>125 &lt; 131 → 往右，left = 6<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>6<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>6<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>6<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>131<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><strong>找到！索引 6<\/strong><\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔍 若 left > right 還沒找到，代表資料不在串列裡。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "二分搜尋程式", "chapter": "第三節：二分搜尋與效率", "bg": "white", "html": "<h2 class='slide-title'>💻 二分搜尋程式<\/h2>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>a = [101, 103, 107, 112, 118, 125, 131, 140, 152, 160]\nkey = int(input(&quot;商品編號：&quot;))\nleft, right = 0, len(a) - 1\ncount, found = 0, -1\nwhile left &lt;= right:\n    mid = (left + right) // 2\n    count += 1\n    if a[mid] == key:\n        found = mid\n        break\n    elif a[mid] &gt; key:\n        right = mid - 1\n    else:\n        left = mid + 1\nprint(&quot;索引&quot;, found, &quot;比較次數&quot;, count)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>商品編號：131\n索引 6 比較次數 4<\/pre><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#505 二分搜尋演算法<\/strong>、<strong>#506 二分搜尋比較次數<\/strong>、<strong>#507 二分搜尋商品編號<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 16, "title": "效率比較", "chapter": "第三節：二分搜尋與效率", "bg": "white", "html": "<h2 class='slide-title'>📈 效率比較：資料越多，差距越大<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:40%;'>資料筆數 n<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>循序搜尋最多<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>二分搜尋最多<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>10<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>10 次<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4 次<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1,000<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1,000 次<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>10 次<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>100 萬<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>100 萬次<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>20 次<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>約 2,300 萬（臺灣人口量級）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>約 2,300 萬次<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>25 次<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 循序搜尋的次數和 n 成正比，寫成 <strong>O(n)<\/strong>；二分搜尋大約是 log₂n，寫成 <strong>O(log n)<\/strong>。這就是<strong>演算法效能分析<\/strong>：比較的是「資料變多時，步驟怎麼增加」。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "排序加搜尋", "chapter": "第三節：二分搜尋與效率", "bg": "white", "html": "<h2 class='slide-title'>🤝 排序 ＋ 搜尋：先花時間整理，之後找得快<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📚<\/div><strong style='color:#1e40af;font-size:.9rem;'>圖書館<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>書依索書號排好，才能很快找到<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📖<\/div><strong style='color:#166534;font-size:.9rem;'>字典<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>依字母或部首排序，翻一半一半找<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🗃️<\/div><strong style='color:#854d0e;font-size:.9rem;'>資料庫<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>幫資料建「索引」，查詢才快<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 ⚖️ 取捨：只找一次，循序搜尋就夠；要反覆找很多次，先排序再用二分搜尋比較划算。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 18, "title": "第三節 隨堂測驗", "chapter": right = mid - 1", "mid = mid + 1", "結束搜尋"], "answer": 1, "explain": "中間值比要找的大，表示 key 只可能在左半邊，所以把 right 移到 mid − 1。"}]}};</script>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 20;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u6c23\u6ce1\u6392\u5e8f", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u5faa\u5e8f\u641c\u5c0b", "start": 9}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u4e8c\u5206\u641c\u5c0b\u8207\u6548\u7387", "start": 13}, {"name": "\u5be6\u4f5c\u8207\u7e3d\u7d50", "start": 19}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

init();
