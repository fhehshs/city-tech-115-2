<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市科技 Python（高一第二學期） — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.5;white-space:pre-wrap}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>
<body>
<script>window.__SLIDES__=[{"id": 1, "title": "重複結構", "chapter": "封面", "bg": "navy", "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>🔁<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>重複結構：迴圈<\/h1>\n  <h2 style='font-size:1.25rem;font-weight:400;color:#93c5fd;margin-bottom:24px;'>Repetition · for · range() · while · break<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;'><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔢 range()<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>➕ 累加器<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>⭐ 雙重迴圈<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>⏳ while<\/span><\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>城市科技 · 高一第二學期 ｜ 第 4 週<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 2, "title": "為什麼要迴圈", "chapter": "第一節：for 迴圈與 range()", "bg": "white", "html": "<h2 class='slide-title'>😩 印 50 行 Hello Python!，你要寫 50 次 print 嗎？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>沒有迴圈<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>print(&quot;Hello Python!&quot;)\nprint(&quot;Hello Python!&quot;)\nprint(&quot;Hello Python!&quot;)\n# ……還要再 47 行<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'><\/pre><\/div><\/div>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>有迴圈：2 行搞定<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>for i in range(50):\n    print(&quot;Hello Python!&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>Hello Python!\nHello Python!\n…（共 50 行）<\/pre><\/div><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔁 <strong>重複結構<\/strong>：重複執行某些敘述，直到滿足特定條件為止，也叫<strong>迴圈（loop）<\/strong>。電腦最擅長做重複又不會累的事。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "for 語法", "chapter": "第一節：for 迴圈與 range()", "bg": "white", "html": "<h2 class='slide-title'>🔢 for 迴圈語法<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>for 變數 in range(起始值, 結束值, 間隔):<\/code>　→ 變數依序取 range 產生的每個數，每取一個就執行一次區塊。<\/p><\/div>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#166534;font-size:.88rem;'>結束值「不包含」<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>range(1, 6) 是 1～5，不是 1～6<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#166534;font-size:.88rem;'>起始值可省略<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>省略時從 0 開始：range(6) 等於 range(0, 6)<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#166534;font-size:.88rem;'>間隔可省略<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>省略時每次加 1；可以是負數（倒數）<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdf4;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>4<\/div><div><strong style='color:#166534;font-size:.88rem;'>別忘了冒號和縮排<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>和 if 一樣，迴圈區塊要縮排<\/div><\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "range 實例", "chapter": "第一節：for 迴圈與 range()", "bg": "white", "html": "<h2 class='slide-title'>🧪 range() 實例：先猜再看<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:32%;'>寫法<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:44%;'>產生的數<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:24%;'>重複幾次<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>range(6)<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>0, 1, 2, 3, 4, 5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>6<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>range(2, 6)<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2, 3, 4, 5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>range(2, 15, 3)<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2, 5, 8, 11, 14<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>range(10, 0, -2)<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>10, 8, 6, 4, 2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>range(1, n + 1)<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1, 2, …, n<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>n<\/td><\/tr><\/table>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>for i in range(2, 15, 3):\n    print(i, end=&quot; &quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>2 5 8 11 14 <\/pre><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧮 小技巧：range(a, b) 會重複 <strong>b − a<\/strong> 次。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "for 搭配字串", "chapter": "第一節：for 迴圈與 range()", "bg": "white", "html": "<h2 class='slide-title'>🔤 for 也可以「走過」一串東西<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>逐一取出字串的每個字<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>for ch in &quot;Python&quot;:\n    print(ch, end=&quot;-&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>P-y-t-h-o-n-<\/pre><\/div><\/div>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>逐一取出串列的每個元素（第 6 章詳細學）<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>for city in [&quot;台北&quot;, &quot;台中&quot;, &quot;高雄&quot;]:\n    print(city, &quot;加油！&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>台北 加油！\n台中 加油！\n高雄 加油！<\/pre><\/div><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 📌 Python 的 for 是「<strong>對一串東西裡的每一個<\/strong>做事」，range() 只是其中一種「一串數字」。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 6, "title": "流程圖", "chapter": "第一節：for 迴圈與 range()", "bg": "white", "html": "<h2 class='slide-title'>🗺️ 計數迴圈的流程圖<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='display:flex;flex-direction:column;align-items:flex-start;gap:0;'><div style='display:flex;align-items:center;'><div style='width:230px;display:flex;justify-content:center;'><div style='border-radius:4px;background:#dbeafe;color:#1e3a8a;width:170px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>i = 1<\/div><\/div><\/div><div style='width:230px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:230px;display:flex;justify-content:center;'><div style='clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#fef3c7;color:#78350f;width:230px;padding:22px 26px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>i <= 5 ?<\/div><\/div><div style='font-size:.75rem;color:#b45309;font-weight:600;margin-left:10px;'>否 → 離開迴圈<\/div><\/div><div style='width:230px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:230px;display:flex;justify-content:center;'><div style='border-radius:4px;background:#dbeafe;color:#1e3a8a;width:170px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>輸出 i<\/div><\/div><\/div><div style='width:230px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:230px;display:flex;justify-content:center;'><div style='border-radius:4px;background:#dbeafe;color:#1e3a8a;width:170px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>i = i + 1<\/div><\/div><div style='font-size:.75rem;color:#b45309;font-weight:600;margin-left:10px;'>→ 回到判斷<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🤖<\/div><strong style='color:#1e40af;font-size:.9rem;'>for 幫你做了三件事<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>① 設定起始值 i = 1<br>② 每次檢查是否還在範圍內<br>③ 每輪結束自動把 i 往下一個<br><br>下一節的 while 迴圈，這三件事要<strong>自己寫<\/strong>。<\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 7, "title": "第一節 隨堂測驗", "chapter": "第一節：for 迴圈與 range()", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>for 迴圈與 range() ｜ 4 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 8, "title": "累加器", "chapter": "第二節：累加與雙重迴圈", "bg": "white", "html": "<h2 class='slide-title'>➕ 累加器：計算 1 + 2 + … + n<\/h2>\n<div style='display:grid;grid-template-columns:1.5fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>n = int(input(&quot;n=&quot;))\ntotal = 0                # ① 迴圈前先歸零\nfor i in range(1, n + 1):\n    total = total + i    # ② 每輪加上 i\nprint(&quot;1 加到&quot;, n, &quot;的和&quot;, total)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>n=5\n1 加到 5 的和 15<\/pre><\/div><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>i<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>total<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>（開始）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>0<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>6<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>10<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>15<\/td><\/tr><\/table>\n<\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> ⚠️ 變數別叫 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>sum<\/code>：它是 Python 內建函式，蓋掉之後 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>sum([1,2,3])<\/code> 就會出錯。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 9, "title": "累加變化題", "chapter": "第二節：累加與雙重迴圈", "bg": "white", "html": "<h2 class='slide-title'>🧩 累加的變化題<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:46%;'>題目<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:54%;'>關鍵寫法<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3 + 6 + 9 + … + 150<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>for i in range(3, 151, 3)<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1～n 的偶數和<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>for i in range(2, n + 1, 2)<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1～n 中 7 的倍數或個位數是 7<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>if i % 7 == 0 or i % 10 == 7:<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1 × 2 × 3 × … × n（n!）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>p = 1 開始，p = p * i（乘法要從 1 開始！）<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>n + (n−1) + … + 1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>for i in range(n, 0, -1)<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#323 計算 1 加到 n 的值<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 10, "title": "雙重迴圈", "chapter": "第二節：累加與雙重迴圈", "bg": "white", "html": "<h2 class='slide-title'>🔁🔁 雙重迴圈：迴圈裡還有迴圈<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>for i in range(4):          # 外圈：4 列\n    for j in range(6):      # 內圈：每列 6 個\n        print(&quot;*&quot;, end=&quot;&quot;)\n    print()                 # 換行<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>******\n******\n******\n******<\/pre><\/div><\/div>\n<div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🕐<\/div><strong style='color:#5b21b6;font-size:.9rem;'>時鐘的比喻<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>外圈像<strong>時針<\/strong>、內圈像<strong>分針<\/strong>：時針走 1 格，分針要轉完一整圈。<br><br>總共執行 4 × 6 = <strong>24<\/strong> 次 print(\"*\")<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 💡 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print()<\/code> 括號裡什麼都沒有，就是「只換行」。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 11, "title": "星號三角形", "chapter": "第二節：累加與雙重迴圈", "bg": "white", "html": "<h2 class='slide-title'>⭐ 範例：星號三角形<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>n = int(input(&quot;n=&quot;))\nfor i in range(1, n + 1):\n    for j in range(i):     # 第 i 列印 i 個\n        print(&quot;*&quot;, end=&quot;&quot;)\n    print()<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>n=4\n*\n**\n***\n****<\/pre><\/div><\/div>\n<div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🔺<\/div><strong style='color:#166534;font-size:.9rem;'>關鍵：內圈次數跟著外圈變<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>第 1 列印 1 個、第 2 列印 2 個…<br>所以內圈是 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>range(i)<\/code>。<br><br>挑戰：改成倒三角形？或置中的金字塔？（提示：先印空白）<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#325 印出星號三角形<\/strong>。Python 也可以用 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(&quot;*&quot; * i)<\/code> 一行完成，但要先會用迴圈想。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 12, "title": "九九乘法表", "chapter": "第二節：累加與雙重迴圈", "bg": "white", "html": "<h2 class='slide-title'>✖️ 範例：九九乘法表<\/h2>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>f\"{i*j:2d}\" 讓結果佔 2 格，排版才會對齊<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>for i in range(1, 10):\n    for j in range(1, 10):\n        print(f&quot;{i}x{j}={i*j:2d}&quot;, end=&quot;  &quot;)\n    print()<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>1x1= 1  1x2= 2  1x3= 3 … 1x9= 9\n2x1= 2  2x2= 4  2x3= 6 … 2x9=18\n…\n9x1= 9  9x2=18  9x3=27 … 9x9=81<\/pre><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🤔 想一想：如果要印成「直的」（一欄是一個數的乘法），i 和 j 要怎麼調換？<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 13, "title": "第二節 隨堂測驗", "chapter": "第二節：累加與雙重迴圈", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>累加與雙重迴圈 ｜ 4 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 14, "title": "while 語法", "chapter": "第三節：while 與 break", "bg": "white", "html": "<h2 class='slide-title'>⏳ while：條件成立就一直做<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>i = 1               # ① 起始值\nwhile i &lt; 6:        # ② 條件\n    print(i)\n    i = i + 1       # ③ 更新（不能忘！）<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>1\n2\n3\n4\n5<\/pre><\/div><\/div>\n<div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>♾️<\/div><strong style='color:#991b1b;font-size:.9rem;'>⚠️ 無窮迴圈<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>忘了寫 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>i = i + 1<\/code>，i 永遠是 1，條件永遠成立，程式就停不下來。<br><br>在 Colab 按儲存格左邊的 <strong>■ 停止<\/strong>可以中斷。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#326 while 練習（輸出 1～5）<\/strong>、<strong>#327 輸出 1 加到 n<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "for 和 while 怎麼選", "chapter": "第三節：while 與 break", "bg": "white", "html": "<h2 class='slide-title'>⚖️ for 和 while 怎麼選？<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:16%;'><\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:42%;'>for<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:42%;'>while<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>適合<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><strong>知道要做幾次<\/strong><\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><strong>不知道要做幾次<\/strong>，只知道何時停<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>例子<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>印 50 行、1 加到 n、走過串列<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>存錢到目標金額、猜數字猜對為止、輸入密碼<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>計數<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>自動<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>要自己初始化、自己更新<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🇹🇼 生活例子：捷運「坐 5 站」用 for；「坐到台北車站才下車」用 while。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 16, "title": "while 範例：成績加分", "chapter": "第三節：while 與 break", "bg": "white", "html": "<h2 class='slide-title'>📈 範例：多寫幾個作業才能達標？<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>每多寫一個作業，成績 ×1.05（去除小數）。例如 70 → 73 → 76…。輸入起始與期望成績，輸出至少要多寫幾個。<\/p><\/div>\n<div style='display:grid;grid-template-columns:1.6fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>s = int(input(&quot;起始成績：&quot;))\ngoal = int(input(&quot;期望成績：&quot;))\ncount = 0\nwhile s &lt; goal:\n    s = int(s * 1.05)\n    count += 1\nprint(&quot;至少要多完成&quot;, count, &quot;個作業&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>起始成績：70\n期望成績：85\n至少要多完成 5 個作業<\/pre><\/div><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>次數<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>成績<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>0<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>70<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>73<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>76<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>79<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>82<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>86 ✔<\/td><\/tr><\/table>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#328 業績計算<\/strong>：結構相同，換成業績成長率。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "break 與 continue", "chapter": "第三節：while 與 break", "bg": "white", "html": "<h2 class='slide-title'>🛑 break 跳出、⏭️ continue 跳過<\/h2>\n<div style='display:grid;grid-template-columns:1.5fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>密碼驗證：錯 3 次就鎖住<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>wrong = 0\nwhile True:                 # 先無限循環\n    pw = input(&quot;密碼：&quot;)\n    if pw == &quot;&quot;:\n        continue            # 空白不算，重來\n    if pw == &quot;fhehs2027&quot;:\n        print(&quot;登入成功&quot;)\n        break               # 跳出迴圈\n    wrong += 1\n    if wrong == 3:\n        print(&quot;拒絕存取&quot;)\n        break<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'><\/pre><\/div><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:35%;'>指令<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:65%;'>作用<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>break<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><strong>立刻結束<\/strong>整個迴圈<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>continue<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><strong>跳過<\/strong>這一輪剩下的部分，回到迴圈開頭<\/td><\/tr><\/table>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔐 這就是手機、網站「錯太多次就鎖定」的基本原理，用來防止有人一直亂猜密碼（暴力破解）。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 18, "title": "常見迴圈錯誤", "chapter": "第三節：while 與 break", "bg": "white", "html": "<h2 class='slide-title'>🐞 迴圈常見錯誤<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:40%;'>症狀<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:60%;'>可能原因<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>少算一次（例如只加到 n−1）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>range(1, n) 少了 +1：結束值不包含<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>答案是 0 或很奇怪<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>累加器放在迴圈<strong>裡面<\/strong>，每輪都被歸零<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>乘積永遠是 0<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>乘法的累乘器從 0 開始，應該從 1 開始<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>程式停不下來<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>while 的條件變數沒有更新<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>只印出最後一個結果<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>print 沒有縮排在迴圈裡（或反過來）<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔍 除錯法寶：在迴圈裡加一行 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>print(i, total)<\/code>，看每一輪變數怎麼變——就是程式版的追蹤表。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 19, "title": "第三節 隨堂測驗", "chapter": "第三節：while 與 break", "bg": "purple", "quiz": "q3", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>while 與 break ｜ 4 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 20, "title": "本週實作", "chapter": "實作與總結", "bg": "white", "html": "<h2 class='slide-title'>✏️ 本週實作：Colab ＋ 線上練習<\/h2>\n<div style='display:flex;align-items:center;gap:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 16px;margin-bottom:12px;'><div style='font-size:2rem;'>📓<\/div><div style='flex:1;'><strong style='color:#9a3412;font-size:.9rem;'>第 4 課 Colab 練習（7 題）<\/strong><div style='font-size:.78rem;color:#475569;margin-top:4px;line-height:1.6;'>50 行 Hello、1 加到 n、累加變化題、星號三角形、九九乘法表、成績加分、密碼驗證<br>🔐 請用學校 Google 帳號登入才能開啟。<\/div><\/div><a href='https://colab.research.google.com/drive/1HtSfjeRp_YasZVGaDeasQ9n-mGJdNk6X' target='_blank' rel='noopener' style='background:#f9ab00;color:#1f2937;font-weight:700;font-size:.82rem;padding:9px 16px;border-radius:20px;text-decoration:none;white-space:nowrap;'>在 Colab 開啟 ↗<\/a><\/div>\n<div style='background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px 16px;margin-bottom:12px;'><div style='display:flex;justify-content:space-between;align-items:center;gap:10px;'><strong style='color:#166534;font-size:.9rem;'>💻 線上練習（Online Judge）<\/strong><a href='http://103.226.213.97/course/view.php?id=2109' target='_blank' rel='noopener' style='background:#16a34a;color:#fff;font-weight:700;font-size:.78rem;padding:7px 14px;border-radius:18px;text-decoration:none;white-space:nowrap;'>前往練習網站 ↗<\/a><\/div><ul style='margin:8px 0 0 18px;font-size:.8rem;color:#334155;line-height:1.6;'><li style='margin-bottom:3px;'><strong>#320、#322、#324<\/strong> range()、for 雙重迴圈觀念（測驗）<\/li><li style='margin-bottom:3px;'><strong>#321<\/strong> for 練習：輸出 50 行字串（VPL）<\/li><li style='margin-bottom:3px;'><strong>#323<\/strong> 計算 1 加到 n 的值（VPL）<\/li><li style='margin-bottom:3px;'><strong>#325<\/strong> 印出星號三角形（VPL）<\/li><li style='margin-bottom:3px;'><strong>#326、#327<\/strong> while 練習（VPL）<\/li><li style='margin-bottom:3px;'><strong>#328<\/strong> 業績計算（VPL）<\/li><\/ul><div style='font-size:.72rem;color:#64748b;margin-top:6px;'>課程：115芳和高中資訊科技Py ｜ VPL 題送出後系統會自動「評估」給分<\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 21, "title": "本週總結", "chapter": "實作與總結", "bg": "navy", "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 本週重點<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>for + range()<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>知道次數用 for；range 的結束值不包含<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>累加器<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>迴圈前歸零（乘法從 1），迴圈中累加<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>雙重迴圈<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>外圈控制列、內圈控制每列內容<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>while / break<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>不知道次數用 while；記得更新條件<\/p><\/div><\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>「重複的事交給迴圈，人只要想清楚規則。」<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下一章：學習挑戰——綜合題目大練兵<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "range(2, 6) 會產生哪些數？", "options": ["2, 3, 4, 5, 6", "2, 3, 4, 5", "3, 4, 5, 6", "2, 6"], "answer": 1, "explain": "range 的結束值「不包含」在內，所以是 2 到 5。"}, {"q": "range(1, 10, 3) 會產生哪些數？", "options": ["1, 4, 7", "1, 4, 7, 10", "3, 6, 9", "1, 3, 10"], "answer": 0, "explain": "從 1 開始每次加 3：1、4、7；下一個是 10，但結束值 10 不包含，所以停止。"}, {"q": "for i in range(5): print(\"Hi\") 會印出幾次 Hi？", "options": ["4 次", "5 次", "6 次", "無限次"], "answer": 1, "explain": "range(5) 產生 0、1、2、3、4 共 5 個數，迴圈執行 5 次。"}, {"q": "想讓 i 依序是 10, 8, 6, 4, 2，應該寫？", "options": ["range(10, 2, -2)", "range(10, 0, -2)", "range(2, 10, 2)", "range(10, 1, 2)"], "answer": 1, "explain": "間隔是 -2 代表倒數；結束值不包含，所以要寫到 0 才會包含 2。range(10, 2, -2) 只到 4。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "以下程式輸出？\ntotal = 0\nfor i in range(1, 4):\n    total = total + i\nprint(total)", "options": ["3", "6", "10", "0"], "answer": 1, "explain": "i 是 1、2、3，total 依序變成 1、3、6。"}, {"q": "想計算 1 × 2 × 3 × 4 × 5，累乘的變數 p 一開始應該設為？", "options": ["0", "1", "5", "不用設定"], "answer": 1, "explain": "乘法的「起點」是 1。如果 p = 0，乘任何數都是 0。"}, {"q": "以下程式總共會印出幾個 * ？\nfor i in range(3):\n    for j in range(4):\n        print(\"*\", end=\"\")", "options": ["7", "12", "3", "4"], "answer": 1, "explain": "外圈 3 次，每次內圈 4 次，共 3 × 4 = 12 次。"}, {"q": "印星號三角形時，第 i 列要印 i 個 *，內圈應該寫？", "options": ["for j in range(5):", "for j in range(i):", "for j in range(n):", "for j in range(1):"], "answer": 1, "explain": "內圈次數要跟著外圈的 i 變化，第 1 列 1 次、第 2 列 2 次…，所以是 range(i)。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "下列程式會發生什麼事？\ni = 1\nwhile i &lt; 5:\n    print(i)", "options": ["印出 1 到 4", "印出 1 到 5", "一直印 1，停不下來", "什麼都不印"], "answer": 2, "explain": "迴圈內沒有更新 i，i 永遠是 1，條件 i &lt; 5 永遠成立，形成無窮迴圈。"}, {"q": "下列哪個情境「最適合」用 while 迴圈？", "options": ["印 100 行字", "計算 1 加到 100", "一直讓使用者猜數字，直到猜對為止", "走過串列中每個元素"], "answer": 2, "explain": "猜數字不知道要猜幾次，只知道「猜對就停」，適合用 while。其他都知道次數，用 for 比較簡潔。"}, {"q": "在迴圈中執行到 break 時會？", "options": ["跳過這一輪，繼續下一輪", "立刻結束整個迴圈", "程式當機", "重新開始迴圈"], "answer": 1, "explain": "break 立刻跳出迴圈，接著執行迴圈之後的程式。跳過這一輪的是 continue。"}, {"q": "以下程式輸出？\ni = 0\nwhile i &lt; 10:\n    i += 3\nprint(i)", "options": ["9", "10", "12", "3"], "answer": 2, "explain": "i 依序變成 3、6、9、12。i = 9 時條件仍成立，再加 3 變 12，此時 12 &lt; 10 不成立，離開迴圈印出 12。"}]}};</script>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 21;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1afor \u8ff4\u5708\u8207 range()", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u7d2f\u52a0\u8207\u96d9\u91cd\u8ff4\u5708", "start": 8}, {"name": "\u7b2c\u4e09\u7bc0\uff1awhile \u8207 break", "start": 14}, {"name": "\u5be6\u4f5c\u8207\u7e3d\u7d50", "start": 20}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
