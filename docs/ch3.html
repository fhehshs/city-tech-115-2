<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市科技 Python（高一第二學期） — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.5;white-space:pre-wrap}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>

<script>window.__SLIDES__=[{"id": 1, "title": "循序與選擇結構", "chapter": "封面", "bg": "navy", "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>🔀<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>讓程式學會判斷<\/h1>\n  <h2 style='font-size:1.25rem;font-weight:400;color:#93c5fd;margin-bottom:24px;'>Sequence &amp; Selection Structures<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;'><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>➡️ 循序<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔁 兩數交換<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>❓ if / else<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🪜 elif 多重選擇<\/span><\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>城市科技 · 高一第二學期 ｜ 第 3 週<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 2, "title": "三種基本結構", "chapter": "第一節：結構化程式與循序結構", "bg": "white", "html": "<h2 class='slide-title'>🧱 結構化程式設計：只用三種結構<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>➡️<\/div><strong style='color:#1e40af;font-size:.9rem;'>循序 Sequence<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>一步一步、由上往下執行<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔀<\/div><strong style='color:#854d0e;font-size:.9rem;'>選擇 Selection<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>依條件決定走哪條路<br>if / elif / else<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔁<\/div><strong style='color:#166534;font-size:.9rem;'>重複 Repetition<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>條件成立就反覆執行<br>for / while（下週）<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 1966 年 Böhm 與 Jacopini 證明：<strong>任何演算法都能只用這三種結構組合出來<\/strong>。七年級學過的 Scratch 也是同樣的三種結構。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "流程圖複習", "chapter": "第一節：結構化程式與循序結構", "bg": "white", "html": "<h2 class='slide-title'>🗺️ 流程圖符號複習<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='display:flex;flex-direction:column;align-items:flex-start;gap:0;'><div style='display:flex;align-items:center;'><div style='width:240px;display:flex;justify-content:center;'><div style='border-radius:999px;background:#1e3a5f;color:#fff;width:180px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>開始<\/div><\/div><\/div><div style='width:240px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:240px;display:flex;justify-content:center;'><div style='clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);background:#dcfce7;color:#14532d;width:180px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>輸入半徑 r<\/div><\/div><\/div><div style='width:240px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:240px;display:flex;justify-content:center;'><div style='border-radius:4px;background:#dbeafe;color:#1e3a8a;width:180px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>area = 3.14 * r * r<\/div><\/div><\/div><div style='width:240px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:240px;display:flex;justify-content:center;'><div style='clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);background:#dcfce7;color:#14532d;width:180px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>輸出 area<\/div><\/div><\/div><div style='width:240px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:240px;display:flex;justify-content:center;'><div style='border-radius:999px;background:#1e3a5f;color:#fff;width:180px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>結束<\/div><\/div><\/div><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:40%;'>形狀<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:60%;'>意義<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>橢圓<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>開始／結束<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>平行四邊形<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>輸入／輸出<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>矩形<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>處理（計算、指定）<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>菱形<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>判斷（是／否兩條路）<\/td><\/tr><\/table>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 ✏️ 左邊就是上週「圓面積」程式的流程圖——只有循序結構，從上到下一路走完。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "兩數交換", "chapter": "第一節：結構化程式與循序結構", "bg": "white", "html": "<h2 class='slide-title'>🔄 循序結構的經典：兩數交換<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><strong style='color:#991b1b;font-size:.9rem;'>❌ 錯誤寫法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>x = y<\/code><br><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>y = x<\/code><br><br>x 原本的值被蓋掉了，兩個變數最後一樣。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><strong style='color:#166534;font-size:.9rem;'>✅ 用暫存變數 t<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>t = x<\/code>　先把 x 存起來<br><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>x = y<\/code><br><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>y = t<\/code>　再把原本的 x 給 y<\/div><\/div><\/div>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>想像兩杯飲料要互換，需要第三個空杯<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>x, y = 1, 0\nt = x\nx = y\ny = t\nprint(x, y)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>0 1<\/pre><\/div><\/div>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>x, y = 1, 0\nx, y = y, x      # Python 專屬的簡潔寫法\nprint(x, y)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>0 1<\/pre><\/div><\/div>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "追蹤程式", "chapter": "第一節：結構化程式與循序結構", "bg": "white", "html": "<h2 class='slide-title'>🔍 用追蹤表看懂程式<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>追蹤表（trace table）：每執行一行，就記下每個變數的值。這是除錯和寫 APCS 觀念題最有用的方法。<\/p><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>y = t<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>0<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><strong>1<\/strong><\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 📌 每一列只改變「等號左邊」那個變數，其他照抄上一列。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 6, "title": "第一節 隨堂測驗", "chapter": "第一節：結構化程式與循序結構", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>結構化程式與循序結構 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 7, "title": "if 語法", "chapter": "第二節：if 與 if-else", "bg": "white", "html": "<h2 class='slide-title'>❓ if：條件成立才執行<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>age = int(input(&quot;年齡：&quot;))\nif age &gt;= 18:\n    print(&quot;你的年齡&quot;, age)\n    print(&quot;成年&quot;)\nprint(&quot;謝謝使用&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>年齡：20\n你的年齡 20\n成年\n謝謝使用<\/pre><\/div><\/div>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#fefce8;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#f59e0b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#854d0e;font-size:.88rem;'>條件式後加冒號 :<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>忘了冒號會出現 SyntaxError<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#fefce8;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#f59e0b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#854d0e;font-size:.88rem;'>區塊要縮排<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>同一區塊縮排要一樣（常用 4 格空白）<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#fefce8;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#f59e0b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#854d0e;font-size:.88rem;'>縮排結束 = 區塊結束<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>「謝謝使用」沒有縮排，不管條件都會執行<\/div><\/div><\/div><\/div>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 8, "title": "縮排的重要", "chapter": "第二節：if 與 if-else", "bg": "white", "html": "<h2 class='slide-title'>📏 縮排錯一格，意思就變了<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>兩行都縮排：條件不成立，兩行都不執行<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>age = 10\nif age &gt;= 18:\n    print(&quot;你的年齡&quot;, age)\n    print(&quot;成年&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'><\/pre><\/div><\/div>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>只縮排一行：「成年」一定會被印出來<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>age = 10\nif age &gt;= 18:\n    print(&quot;你的年齡&quot;, age)\nprint(&quot;成年&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>成年<\/pre><\/div><\/div>\n<\/div>\n<div style='background:#fef2f2;padding:11px 16px;border-radius:8px;border-left:4px solid #dc2626;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> ⚠️ 第二個程式沒有語法錯誤，卻輸出了錯的結果——這叫<strong>語意錯誤（邏輯錯誤）<\/strong>，電腦不會提醒你，最難抓！<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 9, "title": "if-else 二選一", "chapter": "第二節：if 與 if-else", "bg": "white", "html": "<h2 class='slide-title'>🔀 if - else：二選一<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1.1fr;gap:12px;'><div style='display:flex;flex-direction:column;align-items:flex-start;gap:0;'><div style='display:flex;align-items:center;'><div style='width:230px;display:flex;justify-content:center;'><div style='clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);background:#dcfce7;color:#14532d;width:170px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>輸入 n<\/div><\/div><\/div><div style='width:230px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:230px;display:flex;justify-content:center;'><div style='clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#fef3c7;color:#78350f;width:230px;padding:22px 26px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>n % 2 == 0 ?<\/div><\/div><div style='font-size:.75rem;color:#b45309;font-weight:600;margin-left:10px;'>是 → 偶數；否 → 奇數<\/div><\/div><div style='width:230px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:230px;display:flex;justify-content:center;'><div style='clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);background:#dcfce7;color:#14532d;width:170px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>輸出結果<\/div><\/div><\/div><\/div>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>判斷奇偶數<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>n = int(input(&quot;n=&quot;))\nif n % 2 == 0:\n    print(&quot;偶數&quot;)\nelse:\n    print(&quot;奇數&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>n=7\n奇數<\/pre><\/div><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 💡 else 後面<strong>不寫條件<\/strong>，代表「以上都不成立的其他情況」，也要加冒號。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 10, "title": "範例：自動加分", "chapter": "第二節：if 與 if-else", "bg": "white", "html": "<h2 class='slide-title'>🎁 範例：59 分自動加 1 分<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>只有 if、沒有 else 也可以<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>s = int(input(&quot;成績：&quot;))\nif s == 59:\n    s = s + 1\nprint(&quot;最後成績&quot;, s)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>成績：59\n最後成績 60<\/pre><\/div><\/div>\n<div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🤔<\/div><strong style='color:#1e40af;font-size:.9rem;'>想一想<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>如果改成「55～59 分一律變 60 分」，條件式要怎麼寫？<br><br><code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>if s &gt;= 55 and s &lt;= 59:<\/code><br>　<code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>s = 60<\/code><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#317 自動加 1 元<\/strong>：題目情境不同，結構完全一樣。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 11, "title": "範例：三數最大", "chapter": "第二節：if 與 if-else", "bg": "white", "html": "<h2 class='slide-title'>🏆 範例：三個數找最大（打擂台法）<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>a, b, c = map(int, input().split())\nmx = a              # 先讓 a 當擂台主\nif b &gt; mx:\n    mx = b\nif c &gt; mx:\n    mx = c\nprint(&quot;最大數&quot;, mx)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>85 92 78\n最大數 92<\/pre><\/div><\/div>\n<div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🥊<\/div><strong style='color:#166534;font-size:.9rem;'>打擂台法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>① 先假設第一個最大<br>② 後面的人一個一個上台挑戰<br>③ 比擂台主大就換人<br><br>這個想法第 6 章處理「一整串成績」時會再用到！<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#318 計算最高銷量<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 12, "title": "第二節 隨堂測驗", "chapter": "第二節：if 與 if-else", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>if 與 if-else ｜ 4 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 13, "title": "if-elif-else", "chapter": "第三節：if-elif-else 多重選擇", "bg": "white", "html": "<h2 class='slide-title'>🪜 if - elif - else：多選一<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>elif ＝ else if。程式<strong>由上往下<\/strong>檢查，遇到<strong>第一個成立<\/strong>的條件就執行它，其餘全部跳過。<\/p><\/div>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>成績等第<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>s = int(input(&quot;成績：&quot;))\nif s &gt;= 90:\n    print(&quot;優&quot;)\nelif s &gt;= 80:\n    print(&quot;甲&quot;)\nelif s &gt;= 70:\n    print(&quot;乙&quot;)\nelif s &gt;= 60:\n    print(&quot;丙&quot;)\nelse:\n    print(&quot;丁&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>成績：85\n甲<\/pre><\/div><\/div>\n<div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💡<\/div><strong style='color:#854d0e;font-size:.9rem;'>為什麼 elif s >= 80 就夠？<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>能走到這一行，代表上面的 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>s &gt;= 90<\/code> 不成立，也就是 s &lt; 90 已經確定了，所以不用再寫 <code style='background:#e2e8f0;color:#0f172a;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em;'>s &lt; 90<\/code>。<\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 14, "title": "條件的順序", "chapter": "第三節：if-elif-else 多重選擇", "bg": "white", "html": "<h2 class='slide-title'>⚠️ 條件順序寫反會怎樣？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><div style='font-size:.72rem;color:#94a3b8;margin-bottom:6px;'>從小的條件開始判斷<\/div><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>s = 95\nif s &gt;= 60:\n    print(&quot;丙&quot;)\nelif s &gt;= 70:\n    print(&quot;乙&quot;)\nelif s &gt;= 90:\n    print(&quot;優&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>丙<\/pre><\/div><\/div>\n<div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>😱<\/div><strong style='color:#991b1b;font-size:.9rem;'>95 分竟然是丙！<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>因為 95 >= 60 第一個成立，後面就不檢查了。<br><br><strong>規則：用 >= 判斷時，從大的往小的寫<\/strong>；用 &lt; 判斷時則從小的往大的寫。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧪 測試時一定要試<strong>邊界值<\/strong>：剛好 90、89、60、59、0、100。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "範例：購物折扣", "chapter": "第三節：if-elif-else 多重選擇", "bg": "white", "html": "<h2 class='slide-title'>🛍️ 範例：購物節折扣<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1.3fr;gap:12px;'><table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:55%;'>購物金額<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:45%;'>折扣<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4000 以上<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>8 折<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>3000 以上<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>85 折<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2000 以上<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>9 折<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1000 以上<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>95 折<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>未滿 1000<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>不打折<\/td><\/tr><\/table>\n<div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>m = int(input(&quot;購物金額：&quot;))\nif m &gt;= 4000:\n    m = m * 0.8\nelif m &gt;= 3000:\n    m = m * 0.85\nelif m &gt;= 2000:\n    m = m * 0.9\nelif m &gt;= 1000:\n    m = m * 0.95\nprint(&quot;實付&quot;, int(m))<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>購物金額：3200\n實付 2720<\/pre><\/div><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧾 對應線上練習 <strong>#319 購物折扣計算<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 16, "title": "範例：BMI", "chapter": "第三節：if-elif-else 多重選擇", "bg": "white", "html": "<h2 class='slide-title'>⚖️ 範例：BMI 判定<\/h2>\n<div style='display:grid;grid-template-columns:1.3fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>h = float(input(&quot;身高(cm)：&quot;)) / 100\nw = float(input(&quot;體重(kg)：&quot;))\nbmi = w / (h * h)\nprint(f&quot;BMI = {bmi:.2f}&quot;)\nif bmi &lt; 18.5:\n    print(&quot;過輕&quot;)\nelif bmi &lt; 24:\n    print(&quot;正常範圍&quot;)\nelif bmi &lt; 27:\n    print(&quot;過重&quot;)\nelse:\n    print(&quot;肥胖&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>身高(cm)：165\n體重(kg)：55\nBMI = 20.20\n正常範圍<\/pre><\/div><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:55%;'>BMI<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:45%;'>判定<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>&lt; 18.5<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>過輕<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>18.5 ～ &lt; 24<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>正常範圍<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>24 ～ &lt; 27<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>過重<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>≥ 27<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>肥胖<\/td><\/tr><\/table>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🇹🇼 標準：衛生福利部國民健康署成人肥胖定義。這裡用 &lt; 判斷，所以條件<strong>從小的往大的<\/strong>寫。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "巢狀 if", "chapter": "第三節：if-elif-else 多重選擇", "bg": "white", "html": "<h2 class='slide-title'>🪆 巢狀 if：if 裡面還有 if<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#1e293b;border-radius:10px;overflow:hidden;margin-bottom:12px;'><div style='padding:10px 14px;'><pre style='margin:0;color:#e2e8f0;font-size:.82rem;line-height:1.6;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>a, b, c = map(int, input().split())\nif a + b &gt; c and a + c &gt; b and b + c &gt; a:\n    if a == b == c:\n        print(&quot;正三角形&quot;)\n    elif a == b or b == c or a == c:\n        print(&quot;等腰三角形&quot;)\n    else:\n        print(&quot;一般三角形&quot;)\nelse:\n    print(&quot;無法構成三角形&quot;)<\/pre><\/div><div style='background:#0b1220;border-top:1px dashed #334155;padding:8px 14px;'><span style='font-size:.68rem;color:#64748b;'>▶ 執行結果<\/span><pre style='margin:4px 0 0;color:#a7f3d0;font-size:.8rem;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;'>3 3 5\n等腰三角形<\/pre><\/div><\/div>\n<div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧩<\/div><strong style='color:#5b21b6;font-size:.9rem;'>先大後小<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>先判斷「能不能成為三角形」，成立之後才判斷是哪一種。<br><br>縮排的層次就是邏輯的層次：內層的 if 屬於外層 if 的區塊。<\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 18, "title": "第三節 隨堂測驗", "chapter": "第三節：if-elif-else 多重選擇", "bg": "purple", "quiz": "q3", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>if-elif-else ｜ 4 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 19, "title": "本週實作", "chapter": "實作與總結", "bg": "white", "html": "<h2 class='slide-title'>✏️ 本週實作：Colab ＋ 線上練習<\/h2>\n<div style='display:flex;align-items:center;gap:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 16px;margin-bottom:12px;'><div style='font-size:2rem;'>📓<\/div><div style='flex:1;'><strong style='color:#9a3412;font-size:.9rem;'>第 3 課 Colab 練習（7 題）<\/strong><div style='font-size:.78rem;color:#475569;margin-top:4px;line-height:1.6;'>兩數交換、奇偶數、59 分加 1 分、三數最大、成績等第、購物折扣、BMI<br>🔐 請用學校 Google 帳號登入才能開啟。<\/div><\/div><a href='https://colab.research.google.com/drive/1ZS2K5Xjc62x_2L57cfnObxKU09HOcNIg' target='_blank' rel='noopener' style='background:#f9ab00;color:#1f2937;font-weight:700;font-size:.82rem;padding:9px 16px;border-radius:20px;text-decoration:none;white-space:nowrap;'>在 Colab 開啟 ↗<\/a><\/div>\n<div style='background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px 16px;margin-bottom:12px;'><div style='display:flex;justify-content:space-between;align-items:center;gap:10px;'><strong style='color:#166534;font-size:.9rem;'>💻 線上練習（Online Judge）<\/strong><a href='http://103.226.213.97/course/view.php?id=2109' target='_blank' rel='noopener' style='background:#16a34a;color:#fff;font-weight:700;font-size:.78rem;padding:7px 14px;border-radius:18px;text-decoration:none;white-space:nowrap;'>前往練習網站 ↗<\/a><\/div><ul style='margin:8px 0 0 18px;font-size:.8rem;color:#334155;line-height:1.6;'><li style='margin-bottom:3px;'><strong>#314<\/strong> 循序結構（測驗）<\/li><li style='margin-bottom:3px;'><strong>#315<\/strong> 兩數交換（VPL）<\/li><li style='margin-bottom:3px;'><strong>#316<\/strong> 選擇結構（測驗）<\/li><li style='margin-bottom:3px;'><strong>#317<\/strong> 自動加 1 元（VPL）<\/li><li style='margin-bottom:3px;'><strong>#318<\/strong> 計算最高銷量（VPL）<\/li><li style='margin-bottom:3px;'><strong>#319<\/strong> 購物折扣計算（VPL）<\/li><\/ul><div style='font-size:.72rem;color:#64748b;margin-top:6px;'>課程：115芳和高中資訊科技Py ｜ VPL 題送出後系統會自動「評估」給分<\/div><\/div>\n<div style='background:#fffbeb;border-radius:10px;padding:14px;'><strong style='color:#92400e;font-size:.9rem;'>📏 評分規準<\/strong><p style='font-size:.78rem;color:#334155;margin-top:6px;line-height:1.8;'><strong style='color:#059669;'>A<\/strong> 全部正確，並用邊界值測試過（截圖或註解說明測了哪些值）<br><strong style='color:#2563eb;'>B<\/strong> 全部能執行且結果正確<br><strong style='color:#d97706;'>C<\/strong> 大部分完成，少數條件判斷有誤<br><strong style='color:#dc2626;'>D<\/strong> 完成一半以下<\/p><\/div>", "quiz": null, "chart": null, "video": null}, {"id": 20, "title": "本週總結", "chapter": "實作與總結", "bg": "navy", "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 本週重點<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>循序結構<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>由上往下執行；兩數交換要用暫存變數<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>if / else<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>條件後加冒號、區塊要縮排<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>elif<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>第一個成立就執行，其餘跳過；注意順序<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>測試<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>一定要試邊界值，抓出邏輯錯誤<\/p><\/div><\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>「電腦永遠照你寫的做，不是照你想的做。」<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下一章：for 與 while 迴圈——讓程式不怕重複<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "結構化程式設計的三種基本結構是？", "options": ["輸入、處理、輸出", "循序、選擇、重複", "變數、函式、串列", "編譯、執行、除錯"], "answer": 1, "explain": "任何演算法都能用循序（依序執行）、選擇（依條件分支）、重複（迴圈）這三種結構組合出來。"}, {"q": "流程圖中，「菱形」代表什麼？", "options": ["開始／結束", "輸入／輸出", "處理", "判斷（決策）"], "answer": 3, "explain": "菱形是判斷符號，會依條件分出「是／否」兩條路，對應程式的 if。"}, {"q": "x = 5, y = 8，執行 t = x、x = y、y = t 後，x、y 依序是？", "options": ["5, 8", "8, 5", "8, 8", "5, 5"], "answer": 1, "explain": "t 先暫存 x 的 5，x 改成 8，最後 y 拿到 t 的 5。兩數成功交換。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "下列哪一行 if 敘述的寫法正確？", "options": ["if score &gt;= 60", "if score &gt;= 60:", "if (score &gt;= 60) then:", "if score =&gt; 60:"], "answer": 1, "explain": "Python 的 if 條件後要加冒號；大於等於是 &gt;=（不是 =&gt;）；不需要 then。括號可加可不加。"}, {"q": "以下程式輸出什麼？\nage = 10\nif age &gt;= 18:\n    print(\"A\")\nprint(\"B\")", "options": ["A", "B", "A 和 B", "什麼都不印"], "answer": 1, "explain": "條件不成立，縮排的 print(\"A\") 不執行；print(\"B\") 沒有縮排，不屬於 if 區塊，一定會執行。"}, {"q": "判斷 n 是奇數還是偶數，else 區塊在什麼時候執行？", "options": ["n % 2 == 0 成立時", "n % 2 == 0 不成立時", "一定會執行", "永遠不執行"], "answer": 1, "explain": "else 是 if 條件「不成立」時才執行的區塊。if 和 else 兩個區塊一定剛好執行其中一個。"}, {"q": "程式沒有出現錯誤訊息，但輸出的結果不對，這叫做？", "options": ["語法錯誤", "語意（邏輯）錯誤", "網路錯誤", "硬體錯誤"], "answer": 1, "explain": "語法錯誤電腦會直接報錯；語意錯誤的程式能執行，只是結果不是你要的，例如縮排錯一格。要靠測試和追蹤才找得到。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "s = 85，下列程式輸出？\nif s &gt;= 90: print(\"優\")\nelif s &gt;= 80: print(\"甲\")\nelif s &gt;= 70: print(\"乙\")\nelse: print(\"丙\")", "options": ["優", "甲", "甲 和 乙", "丙"], "answer": 1, "explain": "85 &gt;= 90 不成立；85 &gt;= 80 成立，印出「甲」後就跳出整個 if-elif-else，不會再檢查 &gt;= 70。"}, {"q": "s = 95，下列程式輸出？\nif s &gt;= 60: print(\"丙\")\nelif s &gt;= 90: print(\"優\")", "options": ["丙", "優", "丙 和 優", "什麼都不印"], "answer": 0, "explain": "95 &gt;= 60 第一個成立，印出「丙」後就結束了。這就是條件順序寫反造成的邏輯錯誤，應該從大的條件開始判斷。"}, {"q": "購物滿 1000 打 95 折、滿 2000 打 9 折。消費 2500 元時，正確的判斷順序是？", "options": ["先判斷 &gt;= 1000，再判斷 &gt;= 2000", "先判斷 &gt;= 2000，再判斷 &gt;= 1000", "順序不影響結果", "要用兩個獨立的 if 都執行"], "answer": 1, "explain": "2500 同時滿足 &gt;= 1000 和 &gt;= 2000。要讓它得到 9 折，必須先檢查 &gt;= 2000。"}, {"q": "測試成績等第程式時，下列哪一組測試值「最」能找出錯誤？", "options": ["50, 75, 95", "90, 89, 80, 79, 60, 59", "1, 2, 3", "100, 100, 100"], "answer": 1, "explain": "錯誤最常發生在條件的邊界（例如 &gt;= 和 &gt; 寫錯）。剛好等於分界值以及差 1 的值，最容易發現問題。"}]}};</script>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 20;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u7d50\u69cb\u5316\u7a0b\u5f0f\u8207\u5faa\u5e8f\u7d50\u69cb", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1aif \u8207 if-else", "start": 7}, {"name": "\u7b2c\u4e09\u7bc0\uff1aif-elif-else \u591a\u91cd\u9078\u64c7", "start": 13}, {"name": "\u5be6\u4f5c\u8207\u7e3d\u7d50", "start": 19}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
